<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mozart's Lost Masterpiece</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main id="stage">
      <img id="mozart" src="{{ url_for('static', filename='img/mozart/mozart.png') }}" alt="Mozart">
      <p id="dialogue"></p>
      <div id="choices" hidden>
        <button id="yes">Yes</button>
        <button id="no">No</button>
      </div>
      <img id="sheet" src="" alt="Sheet music fragment" hidden>     
      <div id="thumbs">
        <img class="thumb" data-position="0" src="{{ url_for('static', filename='img/thumbs/score-sprite-no-bg.png') }}" alt="Sheet music fragment">
        <img class="thumb" data-position="1" src="{{ url_for('static', filename='img/thumbs/score-sprite-no-bg.png') }}" alt="Sheet music fragment">
        <img class="thumb" data-position="2" src="{{ url_for('static', filename='img/thumbs/score-sprite-no-bg.png') }}" alt="Sheet music fragment">
        <img class="thumb" data-position="3" src="{{ url_for('static', filename='img/thumbs/score-sprite-no-bg.png') }}" alt="Sheet music fragment">
      </div>
    </main>
    <script src="{{ url_for('static', filename='game.js') }}"></script>
  </body>
</html>
